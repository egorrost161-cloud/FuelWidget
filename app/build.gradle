plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.fuelwidget'
    compileSdk 29

    defaultConfig {
        applicationId "com.example.fuelwidget"
        minSdk 28
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Это даёт доступ к android.car.* классам без скачивания JAR
    useLibrary 'android.car'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
